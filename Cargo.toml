[package]
name = "EdenExplorer"
version = "0.27.0"
edition = "2024"
build = "src/build.rs"

[[bin]]
name = "EdenExplorer"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[package.metadata.winres]
OriginalFilename = "EdenExplorer.exe"
LegalCopyright = "Copyright © 2026"

[dependencies]
crc32fast = "1.4"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
regex = "1.11.1"
image = "0.25.10"
eframe = "0.35.0"
egui = { version = "0.35.0", features = ["serde"] }
egui_extras = "0.35.0"
ntapi = "0.4.3"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_Ioctl",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_SystemServices",
    "Win32_System_Registry",
    "Win32_System_WindowsProgramming",
    "Win32_System_Com",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_PortableDevices",
    "Win32_NetworkManagement_NetManagement",
    "Win32_NetworkManagement_WNet",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Graphics_DirectWrite",
    "Win32_Globalization",
    "Data_Pdf",
    "Storage",
    "Storage_Streams",
    "Graphics_Imaging",
    "Win32_Graphics_Imaging",
    "Win32_Media_MediaFoundation",
] }
windows-core = "0.62.2"
windows-future = "0.3.2"
crossbeam-channel = "0.5.15"
dirs = "6.0"
bincode = "1.3"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.228", features = ["derive"], default-features = false }
rayon = "1.12"
egui-phosphor = { version = "0.13.0", features = ["regular", "fill"] }
serde_json = "1.0.149"
num_cpus = "1.17"
lazy_static = "1.5"
raw-window-handle = "0.6.2"
rfd = "0.17.2"
lru = "0.17"
chrono = "0.4.44"
fluent = "0.16"
fluent-bundle = "0.15"
unic-langid = "0.9"
rust-embed = "8"
sys-locale = "0.3"
rand = "0.9"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.38"
pdf-extract = "0.12"
ab_glyph = "0.2"
ttf-parser = "0.25"
resvg = "0.45"
fontdb = "0.23"
flate2 = "1"
syntect = { version = "5", default-features = false, features = ["parsing", "regex-fancy", "default-syntaxes", "default-themes"] }
sevenz-rust2 = "0.22"
pulldown-cmark = "0.12"
everything-ipc = "0.1.4"
